<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logbook - Yapılacaklar (Kanban)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="icon" type="image/png" href="icons/icon48.png">
</head>
<body class="page-todo">

    <div class="nav-bar">
        <a href="../index.html" class="nav-brand">Logbook</a>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="tab-buttons">
                <a id="btn-pano-sekme" class="tab-btn" href="../pano/pano.html">Pano</a>
                <a id="btn-todo-sekme" class="tab-btn active" href="../todo/todo.html">Yapılacaklar</a>
                <a id="btn-ajanda-sekme" class="tab-btn" href="../ajanda/ajanda.html">Ajanda / Takvim</a>
                <a id="btn-defter-sekme" class="tab-btn" href="../defter/defter.html">Defter</a>
                <div class="nav-dropdown-container">
                    <a id="btn-finans-sekme" class="tab-btn" href="../finans/finans.html">Finans & Zaman Analizi</a>
                    <div class="nav-dropdown-content">
                        <a href="../finans/finans.html#butce">💰 Bütçe & Harcamalar</a>
                        <a href="../finans/finans.html#doviz">💱 Canlı Döviz Masası</a>
                    </div>
                </div>
            </div>
            <button id="dark-mode-toggle" class="dark-mode-btn" title="Temayı Değiştir">🌙</button>
        </div>
    </div>

    <div id="todo-sekme" class="tab-content active">
        <div class="todo-hub">
            <div class="todo-sidebar">
                <h3>Listelerim</h3>
                <ul id="listeler-menusu"></ul>
                <button id="yeni-liste-btn">+ Yeni Liste Oluştur</button>
            </div>
            <div class="todo-main">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 id="aktif-liste-basligi" style="margin:0;">Genel Görevler</h2>
                    <button id="liste-sil-btn" style="background:#fee2e2; color:#ef4444; border:1px solid #fca5a5; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:600; font-size:13px;">Bu Listeyi Komple Sil</button>
                </div>
                <div class="todo-input-area">
                    <input type="text" id="todo-input" placeholder="Bu listeye yeni görev ekle...">
                    <button id="todo-ekle-btn">Ekle</button>
                </div>
                
                <div class="kanban-board">
                    <div class="kanban-column" id="havuz-todo" ondragover="allowDrop(event)" ondrop="handleHavuzDrop(event, 'todo')">
                        <h4>📋 Yapılacaklar</h4>
                        <ul id="todo-liste-todo" class="kanban-list"></ul>
                    </div>
                    <div class="kanban-column" id="havuz-progress" ondragover="allowDrop(event)" ondrop="handleHavuzDrop(event, 'progress')">
                        <h4>⚡ Yapılıyor</h4>
                        <ul id="todo-liste-progress" class="kanban-list"></ul>
                    </div>
                    <div class="kanban-column" id="havuz-done" ondragover="allowDrop(event)" ondrop="handleHavuzDrop(event, 'done')">
                        <h4>✅ Tamamlandı</h4>
                        <ul id="todo-liste-done" class="kanban-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/common.js" data-main="todo.js"></script>
</body>
</html>
